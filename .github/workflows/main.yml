name: Build TiVBook Player

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  player-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the TiVBook files
        run: |
          if [ ! -f package.json ]; then
            dir=$(dirname "$(find . -maxdepth 3 -name package-lock.json | head -1)")
            shopt -s dotglob
            mv "$dir"/* .
          fi
          ls

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Build the app
        run: |
          npm run build:core
          npm run build -w @tivbook/player

      - name: Create the Android project
        working-directory: apps/player
        run: |
          npx cap add android
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build the APK
        working-directory: apps/player/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../../TiVBook-Player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TiVBook-Player-Android
          path: TiVBook-Player.apk

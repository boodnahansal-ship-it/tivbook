[package]
name = "tivbook-staff"
version = "0.1.0"
description = "TiVBook Staff — Ti Vegas"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
